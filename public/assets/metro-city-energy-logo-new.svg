          <line x1="0" y1="-155" x2="0" y2="-118"/>
          <line x1="75" y1="-140" x2="52" y2="-104"/>
          <line x1="140" y1="-75" x2="104" y2="-52"/>
          <line x1="155" y1="0" x2="118" y2="0"/>
          <line x1="140" y1="75" x2="104" y2="52"/>
          <line x1="75" y1="140" x2="52" y2="104"/>
          <line x1="0" y1="155" x2="0" y2="118"/>
