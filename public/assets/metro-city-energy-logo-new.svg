<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Metro City Energy</title>
  <desc id="desc">Metallic energy logo with sun, wind turbines, solar panels and the words Metro City Energy.</desc>
  <defs>
    <linearGradient id="gold" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f6d77a"/>
      <stop offset="18%" stop-color="#d9af45"/>
      <stop offset="38%" stop-color="#f7e8aa"/>
      <stop offset="52%" stop-color="#c8941d"/>
      <stop offset="72%" stop-color="#f7e7b0"/>
      <stop offset="100%" stop-color="#b77b18"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#e8edf3"/>
      <stop offset="16%" stop-color="#a6adb6"/>
      <stop offset="36%" stop-color="#f0f4f7"/>
      <stop offset="52%" stop-color="#8e98a0"/>
      <stop offset="74%" stop-color="#edf2f6"/>
      <stop offset="100%" stop-color="#7c878d"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#88939d"/>
      <stop offset="50%" stop-color="#4d5860"/>
      <stop offset="100%" stop-color="#e7edf3"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde9a8"/>
      <stop offset="50%" stop-color="#f5c55a"/>
      <stop offset="100%" stop-color="#cc8d1b"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

