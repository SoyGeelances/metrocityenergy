          <path d="M-17 0 L-42 30 L-67 0 M-17 0 L0 0" fill="none" stroke="#dfe5ea" stroke-width="4"/>
          <circle cx="-18" cy="0" r="10" fill="#d6dbe1" stroke="#6c7680" stroke-width="3"/>
          <g fill="none" stroke="#dfe7ee" stroke-width="4" stroke-linecap="round">
            <path d="M-20 0 L-20 120"/>
