    <text x="700" y="560" text-anchor="middle" font-size="150" font-weight="900" letter-spacing="2" font-family="Arial Black, Impact, sans-serif" fill="url(#gold)" style="paint-order:stroke; stroke:#8d6718; stroke-width:10;">ENERGY</text>
    <path d="M195 592 H1205" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M215 592 L350 592" stroke="#f4d78c" stroke-width="5" opacity="0.9"/>
    <path d="M1050 592 L1185 592" stroke="#f4d78c" stroke-width="5" opacity="0.9"/>
