              <line x1="12" y1="80" x2="12" y2="170"/>
              <line x1="40" y1="80" x2="40" y2="170"/>
              <line x1="-120" y1="103" x2="50" y2="103"/>
              <line x1="-120" y1="132" x2="50" y2="132"/>
              <line x1="-120" y1="161" x2="50" y2="161"/>
