name: Production Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for Node/Nitro production
        env:
          NITRO_PRESET: node-server
        run: bun run build

      - name: Inspect build output
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd
          echo "=== ROOT ==="
          ls -la
          echo "=== OUTPUT ==="
          ls -la .output || true
          echo "=== SERVER ==="
          ls -la .output/server || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrocityenergy-production-build
          path: .output/
          if-no-files-found: error
          include-hidden-files: true

      - name: Deploy build via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 21098
          source: ".output"
          target: ${{ secrets.PRODUCTION_PATH }}

      - name: Verify deployed files
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 21098
          script: |
            cd ${{ secrets.PRODUCTION_PATH }}
            echo "=== DEPLOYED FILES ==="
            ls -la .output
            echo "=== SERVER ==="
            ls -la .output/server